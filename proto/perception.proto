syntax = "proto3";
package limo;

import "common.proto";

enum ObjectClass {
  OBJECT_UNKNOWN = 0;
  OBJECT_PERSON = 1;
  OBJECT_VEHICLE = 2;
  OBJECT_BICYCLE = 3;
  OBJECT_CONE = 4;
  OBJECT_SIGN = 5;
  OBJECT_OBSTACLE = 6;
  OBJECT_STOP_SIGN = 7;
  OBJECT_YIELD_SIGN = 8;
  OBJECT_SPEED_LIMIT = 9;
}

message Detection {
  ObjectClass object_class = 1;
  float confidence = 2;          // [0.0, 1.0]
  BoundingBox2D bbox_image = 3;  // bounding box in image coordinates
  Point2D position_world = 4;    // estimated position in world frame
  float distance = 5;            // meters from robot
  Twist2D velocity_world = 6;    // estimated velocity in world frame (unset/zero = static or unknown)
  float radius = 7;              // object extent radius in meters (0 = point sample)
  uint32 track_id = 8;           // stable tracker id (0 = untracked point sample)
  // Oriented-rectangle extent (both half-extents > 0 activates it; the
  // circular `radius` above remains the conservative fallback so old
  // consumers stay correct). Cures the circular over-approximation that
  // closed narrow passages between box obstacles: a cube's circumscribed
  // circle overstates its half-width by up to 41%.
  float half_extent_x = 9;       // meters, along the box's own x (heading) axis
  float half_extent_y = 10;      // meters, along the box's own y axis
  float orientation = 11;        // radians, box heading in world frame
}

message DetectionArray {
  Header header = 1;
  repeated Detection detections = 2;
}

message LanePoint {
  double x = 1;
  double y = 2;
  float confidence = 3;
}

message LaneLine {
  enum LaneType {
    LANE_UNKNOWN = 0;
    LANE_SOLID = 1;
    LANE_DASHED = 2;
    LANE_DOUBLE_SOLID = 3;
  }
  LaneType type = 1;
  repeated LanePoint points = 2;
  float confidence = 3;
}

message LaneMarkings {
  Header header = 1;
  repeated LaneLine lanes = 2;
}

message OccupancyGrid {
  Header header = 1;
  uint32 width = 2;           // cells
  uint32 height = 3;          // cells
  float resolution = 4;       // meters per cell
  Pose2D origin = 5;          // world position of cell (0,0)
  bytes data = 6;             // row-major, 0=free, 100=occupied, 255=unknown
}
