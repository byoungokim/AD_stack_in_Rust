[package]
name = "limo-sim-bridge"
version = "0.1.0"
edition = "2021"
description = "Limo Drive - Isaac Sim ZMQ bridge"

[[bin]]
name = "limo_sim_bridge"
path = "src/main.rs"

[dependencies]
limo-proto = { path = "../limo-proto" }
limo-transport = { path = "../limo-transport" }
prost = "0.13"
zmq = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
ctrlc = "3.4"
