[package]
name = "limo-hal"
version = "0.1.0"
edition = "2021"
description = "Limo Drive - Hardware Abstraction Layer traits and implementations"

[dependencies]
limo-proto = { path = "../limo-proto" }
limo-transport = { path = "../limo-transport" }
prost = "0.13"
zmq = "0.10"
nalgebra = "0.33"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serialport = "4.6"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
