name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libzmq3-dev: zmq crate; protobuf-compiler: prost-build; libudev-dev: serialport
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev pkg-config protobuf-compiler libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace --tests

      - name: cargo test
        run: cargo test --workspace
