[package]
name = "limo-control"
version = "0.1.0"
edition = "2021"
description = "Limo Drive - Control process (Process 3)"

[lib]
name = "limo_control"
path = "src/lib.rs"

[[bin]]
name = "limo_control"
path = "src/main.rs"

[dependencies]
# Shared crates
limo-proto = { path = "../crates/limo-proto" }
limo-transport = { path = "../crates/limo-transport" }
limo-hal = { path = "../crates/limo-hal" }

# Protobuf
prost = "0.13"

# Serial port (chassis communication)
serialport = "4.6"

# Concurrency
crossbeam = "0.8"
crossbeam-channel = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Math
nalgebra = "0.33"

# Error handling
anyhow = "1"
thiserror = "2"

# Signal handling
ctrlc = "3.4"

# ZMQ (for direct use alongside limo-transport)
zmq = "0.10"
