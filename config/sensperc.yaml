# Sensing & Perception process configuration

camera:
  device: "/dev/video0"
  width: 640
  height: 480
  fps: 30
  encoding: "bgr8"

lidar:
  device: "/dev/ttyUSB0"
  baudrate: 230400
  scan_rate_hz: 10
  range_min: 0.1
  range_max: 12.0

# Planar pose of the lidar on the chassis (base_link -> lidar).
# Sim: the gz model mounts the lidar at the base center
# (simulation/models/limo_pro/model.sdf lidar pose "0.0 0 0.15"), so all
# values are 0. Set for hardware if the scanner sits off-center — an
# unmodeled mount offset displaces every projected obstacle by that offset.
lidar_mount:
  x: 0.0    # forward offset, meters
  y: 0.0    # left offset, meters
  yaw: 0.0  # mount yaw vs chassis forward, radians

imu:
  device: "/dev/ttyUSB1"
  baudrate: 115200
  rate_hz: 100

detection:
  model_path: "models/yolov8n.engine"  # TensorRT engine
  confidence_threshold: 0.5
  nms_threshold: 0.45
  input_size: [640, 640]
  rate_hz: 15

lane_detection:
  model_path: "models/lane_det.engine"
  confidence_threshold: 0.3
  rate_hz: 15

slam:
  frontend:
    rate_hz: 10
    min_scan_distance: 0.1   # meters, min movement to trigger scan match
  backend:
    rate_hz: 1
    optimization_iterations: 10

sensor_fusion:
  rate_hz: 20
  # EKF process noise
  process_noise_position: 0.01
  process_noise_heading: 0.005
  # EKF measurement noise
  measurement_noise_imu: 0.1
  measurement_noise_odom: 0.05
  measurement_noise_slam: 0.02

aggregator:
  rate_hz: 10

# Sim-only fault injection. Drop rates in [0.0, 1.0]; 0 = no drops.
# Seed fixes the PRNG so runs are reproducible.
