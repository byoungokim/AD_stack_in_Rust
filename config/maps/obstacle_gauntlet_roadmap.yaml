# Prior node-link roadmap for simulation/worlds/obstacle_gauntlet.sdf
#
# Standing global route knowledge for the gauntlet course: nodes at
# meaningful places, links carrying traversable free width and a cruise
# speed cap. Routing is Dijkstra over travel time (length / speed); the
# metric planners (Hybrid A* + DWA) only execute the next short leg of the
# chosen route. See planning/src/roadmap.rs for the loader/validator.
#
# Frame note: `planner` = the planning/odom frame, anchored at the robot
# spawn pose in the world (-9, 0, yaw 0). Coordinates here are world + (9, 0).
frame: planner
nodes:
  - {id: spawn, x: 0.10, y: 0.15}
  - {id: lane_n_w, x: -0.05, y: 2.45}
  - {id: lane_n_e, x: 6.40, y: 2.55}
  - {id: chan_e, x: 7.10, y: 1.65}
  - {id: slalom_exit, x: 7.05, y: 0.85}
  - {id: gate_mid, x: 8.00, y: 0.85}
  - {id: gate_e, x: 8.70, y: 0.90}
  - {id: plaza, x: 13.20, y: 0.60}
  - {id: goal, x: 17.90, y: 0.50}
  - {id: apex_0, x: 1.40, y: -0.35}
  - {id: apex_1, x: 2.60, y: 0.35}
  - {id: apex_2, x: 3.80, y: -0.35}
  - {id: apex_3, x: 5.00, y: 0.40}
  - {id: apex_4, x: 6.10, y: -0.30}
links:
  - {from: spawn, to: lane_n_w, width: 1.60, speed: 1.20}
  - {from: lane_n_w, to: lane_n_e, width: 1.60, speed: 2.20}
  - {from: lane_n_e, to: chan_e, width: 0.80, speed: 1.00}
  - {from: chan_e, to: slalom_exit, width: 0.80, speed: 1.00}
  - {from: slalom_exit, to: gate_mid, width: 1.10, speed: 1.00}
  - {from: gate_mid, to: gate_e, width: 1.10, speed: 1.20}
  - {from: gate_e, to: plaza, width: 2.50, speed: 2.20}
  - {from: plaza, to: goal, width: 1.50, speed: 1.80}
  - {from: spawn, to: apex_0, width: 0.60, speed: 0.80}
  - {from: apex_0, to: apex_1, width: 0.60, speed: 0.80}
  - {from: apex_1, to: apex_2, width: 0.60, speed: 0.80}
  - {from: apex_2, to: apex_3, width: 0.60, speed: 0.80}
  - {from: apex_3, to: apex_4, width: 0.60, speed: 0.80}
  - {from: apex_4, to: slalom_exit, width: 0.60, speed: 0.80}
