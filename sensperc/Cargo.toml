[package]
name = "limo-sensperc"
version = "0.1.0"
edition = "2021"
description = "Limo Drive - Sensing & Perception process"

[[bin]]
name = "limo_sensperc"
path = "src/main.rs"

[dependencies]
# Shared crates
limo-proto = { path = "../crates/limo-proto" }
limo-transport = { path = "../crates/limo-transport" }
limo-hal = { path = "../crates/limo-hal" }

# Protobuf
prost = "0.13"

# Concurrency
crossbeam = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Math (for store types)
nalgebra = "0.33"

# Error handling
anyhow = "1"

# Signal handling
ctrlc = "3.4"

# ZMQ (for aggregator CH1/CH3)
zmq = "0.10"

# ONNX Runtime for object detection (optional, enable with --features onnx)
[dependencies.ort]
version = "2.0.0-rc.12"
optional = true

[dependencies.ndarray]
version = "0.16"
optional = true

[features]
onnx = ["ort", "ndarray"]
